name: 🔐 SSM to Dotenv
description: >
  Converts SSM parameters to a .env file

inputs:
  ssm-path:
    description: SSM path to load parameters from
    required: true
  output:
    description: Output filename
    default: ".env"
    required: false
  decryption:
    description: Whether to decrypt the parameter
    default: "false"
    required: false
  aws-region:
    description: AWS region for SSM
    default: eu-west-2
    required: false

outputs:
  file-path:
    description: The absolute path to the created .env file

runs:
  using: node20
  main: index.mjs
